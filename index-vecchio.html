<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00436c">
  <meta name="description" content="Gestione personale di entrate, uscite e scadenze">
  <title>Gestione</title>

  <style>
    :root {
      --blu-ottanio: #00436c;
      --ottanio: #228096;
      --crema: #f5f0e8;
      --bianco: #ffffff;
      --testo: #173042;
      --testo-secondario: #60737d;
      --entrate: #18794e;
      --uscite: #b42318;
      --scadenze: #a15c00;
      --bordo: #d8e2e5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--crema);
      color: var(--testo);
      font-family: Arial, sans-serif;
    }

    header {
      padding: 26px 18px;
      background: var(--blu-ottanio);
      color: var(--bianco);
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 31px;
    }

    header p {
      margin: 0;
      opacity: .9;
    }

    main {
      width: min(100% - 24px, 760px);
      margin: auto;
      padding: 16px 0 35px;
    }

    section {
      margin-bottom: 16px;
      padding: 18px;
      background: var(--bianco);
      border-radius: 18px;
      box-shadow: 0 3px 12px #00436c22;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 21px;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .summary-card {
      min-height: 94px;
      padding: 15px;
      border-left: 6px solid var(--ottanio);
      border-radius: 14px;
      background: #eef6f6;
    }

    .summary-card.saldo {
      border-left-color: var(--blu-ottanio);
      background: #e9f1f6;
    }

    .summary-card.scadenze {
      border-left-color: var(--scadenze);
      background: #fff4df;
    }

    .summary-card.entrate {
      border-left-color: var(--entrate);
      background: #eaf7ef;
    }

    .summary-card.uscite {
      border-left-color: var(--uscite);
      background: #fff0ee;
    }

    .summary-label {
      display: block;
      margin-bottom: 7px;
      color: var(--testo-secondario);
      font-size: 14px;
    }

    .summary-value {
      font-size: 21px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input,
    select {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: 1px solid #b7c8d0;
      border-radius: 10px;
      background: var(--bianco);
      color: var(--testo);
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--ottanio);
      color: var(--bianco);
      font-size: 16px;
      font-weight: bold;
    }

    button:active {
      background: var(--blu-ottanio);
      transform: scale(.98);
    }

    #registra {
      min-height: 64px;
      background: var(--blu-ottanio);
      box-shadow: 0 4px 10px #00436c44;
      font-size: 21px;
    }

    .secondary {
      background: #e7eff1;
      color: var(--blu-ottanio);
    }

    .danger {
      width: auto;
      margin: 0;
      padding: 7px 10px;
      background: #fff0ee;
      color: var(--uscite);
      font-size: 14px;
    }

    .status {
      min-height: 22px;
      margin: 8px 0 0;
      color: var(--testo-secondario);
      font-size: 14px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--testo);
    }

    .check-row input {
      width: auto;
      margin: 0;
    }

    .movement {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 0;
      border-top: 1px solid var(--bordo);
    }

    .movement:first-child {
      border-top: 0;
    }

    .movement-main {
      min-width: 0;
    }

    .movement-title {
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .movement-info {
      margin-top: 4px;
      color: var(--testo-secondario);
      font-size: 13px;
      line-height: 1.4;
    }

    .movement-right {
      flex-shrink: 0;
      text-align: right;
    }

    .movement-amount {
      font-weight: bold;
      white-space: nowrap;
    }

    .positive {
      color: var(--entrate);
    }

    .negative {
      color: var(--uscite);
    }

    .warning {
      color: var(--scadenze);
    }

    .empty {
      color: var(--testo-secondario);
      font-size: 14px;
    }

    .bar-row {
      margin: 12px 0;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .bar-background {
      height: 12px;
      overflow: hidden;
      border-radius: 20px;
      background: #e8eeee;
    }

    .bar-fill {
      height: 100%;
      border-radius: 20px;
      background: var(--ottanio);
    }

    .backup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .backup-grid button {
      margin-top: 0;
    }

    .file-input {
      display: none;
    }

    @media (max-width: 480px) {
      .summary,
      .grid,
      .backup-grid {
        grid-template-columns: 1fr;
      }

      .movement {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Gestione</h1>
    <p>Entrate, uscite e scadenze sotto controllo</p>
  </header>

  <main>
    <section>
      <h2>Riepilogo del mese</h2>

      <div class="summary">
        <div class="summary-card saldo">
          <span class="summary-label">Saldo</span>
          <span id="saldo" class="summary-value">0,00 €</span>
        </div>

        <div class="summary-card scadenze">
          <span class="summary-label">Prossime scadenze</span>
          <span id="prossimeScadenze" class="summary-value">0,00 €</span>
        </div>

        <div class="summary-card entrate">
          <span class="summary-label">Entrate</span>
          <span id="totaleEntrate" class="summary-value">0,00 €</span>
        </div>

        <div class="summary-card uscite">
          <span class="summary-label">Uscite</span>
          <span id="totaleUscite" class="summary-value">0,00 €</span>
        </div>
      </div>
    </section>

    <section>
      <h2>Registra un movimento</h2>

      <button id="registra">🎙️ Registra</button>
      <div id="statoVoce" class="status"></div>

      <input
        id="descrizione"
        type="text"
        placeholder="Descrizione, ad esempio supermercato">

      <div class="grid">
        <input
          id="importo"
          type="number"
          step="0.01"
          min="0"
          placeholder="Importo in euro">

        <input
          id="data"
          type="date">
      </div>

      <div class="grid">
        <select id="tipo">
          <option value="uscita">Uscita</option>
          <option value="entrata">Entrata</option>
        </select>

        <select id="stato">
          <option value="pagato">Pagato</option>
          <option value="da_pagare">Da pagare</option>
        </select>
      </div>

      <div class="grid">
        <input
          id="categoria"
          type="text"
          placeholder="Categoria">

        <input
          id="metodo"
          type="text"
          placeholder="Carta, contanti, conto...">
      </div>

      <label class="check-row">
        <input id="ricorrente" type="checkbox">
        Movimento ricorrente mensile
      </label>

      <button id="salva">Salva movimento</button>
      <button id="pulisci" class="secondary">Pulisci campi</button>
    </section>

    <section>
      <h2>Statistiche rapide</h2>
      <div id="statistiche"></div>
    </section>

    <section>
      <h2>Movimenti</h2>

      <input
        id="cerca"
        type="search"
        placeholder="Cerca descrizione o categoria">

      <div id="elenco"></div>
    </section>

    <section>
      <h2>Backup dei dati</h2>

      <div class="backup-grid">
        <button id="esporta">Esporta backup</button>

        <button
          id="scegliFile"
          class="secondary">
          Importa backup
        </button>
      </div>

      <input
        id="fileBackup"
        class="file-input"
        type="file"
        accept="application/json">

      <p class="status">
        Il backup salva entrate, uscite e scadenze in un file JSON.
      </p>
    </section>
  </main>

  <script>
    const CHIAVE = "gestione_movimenti_v2";

    let movimenti = JSON.parse(
      localStorage.getItem(CHIAVE) || "[]"
    );

    const $ = id => document.getElementById(id);

    function oggi() {
      return new Date().toISOString().slice(0, 10);
    }

    function euro(valore) {
      return Number(valore || 0).toLocaleString(
        "it-IT",
        {
          style: "currency",
          currency: "EUR"
        }
      );
    }

    function salvaDati() {
      localStorage.setItem(
        CHIAVE,
        JSON.stringify(movimenti)
      );
    }

    function normalizzaNumero(testo) {
      const pulito = testo
        .replace(/s/g, "")
        .replace("€", "")
        .replace(",", ".");

      const numero = Number(pulito);

      return Number.isFinite(numero) ? numero : null;
    }

    function estraiImporto(testo) {
      const numeri = testo.match(
        /d+(?:[.,]d{1,2})?/g
      );

      if (!numeri || !numeri.length) {
        return null;
      }

      return normalizzaNumero(numeri[0]);
    }

    function estraiTipo(testo) {
      if (
        /ricevuto|incassato|stipendio|entrata|guadagnato/i
          .test(testo)
      ) {
        return "entrata";
      }

      return "uscita";
    }

    function estraiStato(testo) {
      if (
        /devo pagare|da pagare|scadenza|pagherò|pagare entro/i
          .test(testo)
      ) {
        return "da_pagare";
      }

      return "pagato";
    }

    function suggerisciCategoria(testo) {
      if (/supermercato|spesa|alimentari/i.test(testo)) {
        return "Alimentari";
      }

      if (/affitto|casa|condominio/i.test(testo)) {
        return "Casa";
      }

      if (/benzina|carburante|parcheggio|auto/i.test(testo)) {
        return "Trasporti";
      }

      if (/bar|ristorante|pizzeria|cena|pranzo/i.test(testo)) {
        return "Ristorazione";
      }

      if (/luce|gas|acqua|telefono|internet|bolletta/i.test(testo)) {
        return "Utenze";
      }

      if (/stipendio|salario/i.test(testo)) {
        return "Stipendio";
      }

      return "";
    }

    function aggiornaRiepilogo() {
      const mese = oggi().slice(0, 7);

      const entrate = movimenti
        .filter(m =>
          m.tipo === "entrata" &&
          m.data.startsWith(mese)
        )
        .reduce((totale, m) =>
          totale + Number(m.importo), 0);

      const uscite = movimenti
        .filter(m =>
          m.tipo === "uscita" &&
          m.stato === "pagato" &&
          m.data.startsWith(mese)
        )
        .reduce((totale, m) =>
          totale + Number(m.importo), 0);

      const scadenze = movimenti
        .filter(m =>
          m.tipo === "uscita" &&
          m.stato === "da_pagare"
        )
        .reduce((totale, m) =>
          totale + Number(m.importo), 0);

      $("saldo").textContent = euro(entrate - uscite);
      $("totaleEntrate").textContent = euro(entrate);
      $("totaleUscite").textContent = euro(uscite);
      $("prossimeScadenze").textContent = euro(scadenze);

      aggiornaStatistiche(entrate, uscite);
    }

    function aggiornaStatistiche(entrate, uscite) {
      const categorie = {};

      movimenti
        .filter(m =>
          m.tipo === "uscita" &&
          m.stato === "pagato"
        )
        .forEach(m => {
          const categoria = m.categoria || "Altro";

          categorie[categoria] =
            (categorie[categoria] || 0) +
            Number(m.importo);
        });

      const ordinate = Object.entries(categorie)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      const massimo = ordinate.length
        ? ordinate[0][1]
        : 1;

      let html = `
        <div class="bar-row">
          <div class="bar-label">
            <span>Entrate</span>
            <strong class="positive">${euro(entrate)}</strong>
          </div>
          <div class="bar-background">
            <div
              class="bar-fill"
              style="width:100%;background:#18794e">
            </div>
          </div>
        </div>

        <div class="bar-row">
          <div class="bar-label">
            <span>Uscite</span>
            <strong class="negative">${euro(uscite)}</strong>
          </div>
          <div class="bar-background">
            <div
              class="bar-fill"
              style="width:${uscite ? 100 : 0}%;background:#b42318">
            </div>
          </div>
        </div>
      `;

      if (ordinate.length) {
        html += "<h3>Uscite per categoria</h3>";

        ordinate.forEach(([categoria, valore]) => {
          html += `
            <div class="bar-row">
              <div class="bar-label">
                <span>${categoria}</span>
                <strong>${euro(valore)}</strong>
              </div>
              <div class="bar-background">
                <div
                  class="bar-fill"
                  style="width:${(valore / massimo) * 100}%">
                </div>
              </div>
            </div>
          `;
        });
      } else {
        html += `
          <p class="empty">
            Inserisci alcuni movimenti per vedere le statistiche.
          </p>
        `;
      }

      $("statistiche").innerHTML = html;
    }

    function aggiornaElenco() {
      const ricerca = $("cerca")
        .value
        .toLowerCase()
        .trim();

      const filtrati = movimenti
        .map((movimento, indice) => ({
          movimento,
          indice
        }))
        .filter(({ movimento }) =>
          `${movimento.descrizione} ${movimento.categoria} ${movimento.metodo}`
            .toLowerCase()
            .includes(ricerca)
        )
        .sort((a, b) =>
          b.movimento.data.localeCompare(a.movimento.data)
        );

      if (!filtrati.length) {
        $("elenco").innerHTML =
          `<p class="empty">Nessun movimento registrato.</p>`;
        return;
      }

      $("elenco").innerHTML = filtrati
        .map(({ movimento, indice }) => {
          const segno =
            movimento.tipo === "entrata"
              ? "+"
              : "-";

          const classe =
            movimento.tipo === "entrata"
              ? "positive"
              : "negative";

          const stato =
            movimento.stato === "da_pagare"
              ? "Da pagare"
              : "Pagato";

          const ricorrenza =
            movimento.ricorrente
              ? " · Ricorrente mensile"
              : "";

          return `
            <div class="movement">
              <div class="movement-main">
                <div class="movement-title">
                  ${movimento.descrizione || "Senza descrizione"}
                </div>

                <div class="movement-info">
                  ${movimento.data}
                  · ${movimento.categoria || "Altro"}
                  · ${stato}
                  ${ricorrenza}
                  ${movimento.metodo ? " · " + movimento.metodo : ""}
                </div>
              </div>

              <div class="movement-right">
                <div class="movement-amount ${classe}">
                  ${segno}${euro(movimento.importo)}
                </div>

                <button
                  class="danger"
                  data-delete="${indice}">
                  Elimina
                </button>
              </div>
            </div>
          `;
        })
        .join("");

      document
        .querySelectorAll("[data-delete]")
        .forEach(pulsante => {
          pulsante.onclick = () => {
            const indice = Number(
              pulsante.getAttribute("data-delete")
            );

            if (confirm("Eliminare questo movimento?")) {
              movimenti.splice(indice, 1);
              salvaDati();
              aggiorna();
            }
          };
        });
    }

    function aggiorna() {
      aggiornaRiepilogo();
      aggiornaElenco();
    }

    function pulisciCampi() {
      $("descrizione").value = "";
      $("importo").value = "";
      $("categoria").value = "";
      $("metodo").value = "";
      $("tipo").value = "uscita";
      $("stato").value = "pagato";
      $("data").value = oggi();
      $("ricorrente").checked = false;
      $("statoVoce").textContent = "";
    }

    $("data").value = oggi();

    $("salva").onclick = () => {
      const importo = Number(
        $("importo").value
      );

      if (!importo || importo <= 0) {
        alert("Inserisci un importo valido.");
        return;
      }

      if (!$("data").value) {
        alert("Inserisci una data.");
        return;
      }

      const movimento = {
        id: Date.now(),
        descrizione: $("descrizione").value.trim(),
        importo,
        data: $("data").value,
        tipo: $("tipo").value,
        stato: $("stato").value,
        categoria: $("categoria").value.trim(),
        metodo: $("metodo").value.trim(),
        ricorrente: $("ricorrente").checked
      };

      movimenti.push(movimento);
      salvaDati();
      pulisciCampi();
      aggiorna();
    };

    $("pulisci").onclick = pulisciCampi;
    $("cerca").oninput = aggiornaElenco;

    $("registra").onclick = () => {
      const Riconoscimento =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!Riconoscimento) {
        alert(
          "Il riconoscimento vocale non è disponibile. Usa Chrome."
        );
        return;
      }

      const riconoscimento = new Riconoscimento();

      riconoscimento.lang = "it-IT";
      riconoscimento.continuous = false;
      riconoscimento.interimResults = false;
      riconoscimento.maxAlternatives = 1;

      $("statoVoce").textContent =
        "Ascolto in corso...";

      riconoscimento.onresult = evento => {
        const testo =
          evento.results[0][0].transcript
            .toLowerCase()
            .trim();

        $("descrizione").value = testo;
        $("statoVoce").textContent =
          "Testo riconosciuto: " + testo;

        const importo = estraiImporto(testo);

        if (importo !== null) {
          $("importo").value = importo;
        }

        $("tipo").value = estraiTipo(testo);
        $("stato").value = estraiStato(testo);

        const categoria =
          suggerisciCategoria(testo);

        if (categoria) {
          $("categoria").value = categoria;
        }

        if (/ogni mese|mensile|mensilmente/i.test(testo)) {
          $("ricorrente").checked = true;
        }

        $("importo").scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      };

      riconoscimento.onerror = evento => {
        $("statoVoce").textContent =
          "Errore del microfono: " + evento.error;
      };

      riconoscimento.onend = () => {
        if (
          $("statoVoce").textContent ===
          "Ascolto in corso..."
        ) {
          $("statoVoce").textContent =
            "Non ho ricevuto una frase.";
        }
      };

      riconoscimento.start();
    };

    $("esporta").onclick = () => {
      const contenuto = JSON.stringify(
        movimenti,
        null,
        2
      );

      const file = new Blob(
        [contenuto],
        { type: "application/json" }
      );

      const link = document.createElement("a");

      link.href = URL.createObjectURL(file);
      link.download = "backup-gestione.json";
      link.click();

      URL.revokeObjectURL(link.href);
    };

    $("scegliFile").onclick = () => {
      $("fileBackup").click();
    };

    $("fileBackup").onchange = evento => {
      const file = evento.target.files[0];

      if (!file) {
        return;
      }

      const lettore = new FileReader();

      lettore.onload = () => {
        try {
          const importati = JSON.parse(
            lettore.resu
